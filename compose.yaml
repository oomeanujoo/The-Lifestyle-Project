services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-lifestyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TRAVEL_DB_USER: ${TRAVEL_DB_USER:-travel_app}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD:-travel-local-only}
      PROPERTY_DB_USER: ${PROPERTY_DB_USER:-property_app}
      PROPERTY_DB_PASSWORD: ${PROPERTY_DB_PASSWORD:-property-local-only}
      INTEGRATION_DB_USER: ${INTEGRATION_DB_USER:-integration_app}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:-integration-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lifestyle-postgres:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.34.1
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - lifestyle-ollama:/root/.ollama
  lifestyle-web:
    build:
      context: ./lifestyle-web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      travel-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
  travel-service:
    build:
      context: ./travel-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      TRAVEL_DB_USER: ${TRAVEL_DB_USER:-travel_app}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD:?Set TRAVEL_DB_PASSWORD in an ignored .env file}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${TRAVEL_JVM_MAX_HEAP:-512m}
    ports:
      - "127.0.0.1:${TRAVEL_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 8
  property-service:
    build:
      context: ./property-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      PROPERTY_DB_USER: ${PROPERTY_DB_USER:-property_app}
      PROPERTY_DB_PASSWORD: ${PROPERTY_DB_PASSWORD:?Set PROPERTY_DB_PASSWORD in an ignored .env file}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${PROPERTY_JVM_MAX_HEAP:-512m}
    ports:
      - "127.0.0.1:${PROPERTY_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 8
  integration-service:
    build:
      context: ./integration-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      INTEGRATION_DB_USER: ${INTEGRATION_DB_USER:-integration_app}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Set INTEGRATION_DB_PASSWORD in an ignored .env file}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${INTEGRATION_JVM_MAX_HEAP:-512m}
    ports:
      - "127.0.0.1:${INTEGRATION_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/actuator/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 8
volumes:
  lifestyle-postgres:
  lifestyle-ollama:
