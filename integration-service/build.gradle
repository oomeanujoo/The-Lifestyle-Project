plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.thelifestyle'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // Core (framework-agnostic) Resilience4j modules only — not the Spring
    // Boot starter/autoconfig module, whose Boot-major-version compatibility
    // couldn't be verified on this machine. Wired up by hand in
    // AiProviderRouter instead of via annotations. See TECHNICAL_ARCHITECTURE.md §18.
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

tasks.named('bootRun') {
    jvmArgs = ["-Xmx${System.getenv('INTEGRATION_JVM_MAX_HEAP') ?: '512m'}"]
}
