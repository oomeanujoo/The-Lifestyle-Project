spring:
  application:
    name: integration-service
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=integration
    username: ${INTEGRATION_DB_USER:integration_app}
    password: ${INTEGRATION_DB_PASSWORD:integration-local-only}
  flyway:
    enabled: true
    schemas: integration
    default-schema: integration
    create-schemas: true

# External API credentials — every value below reads from an environment
# variable that YOU set locally (e.g. from your own LOCAL-ACCESS.md); none
# are ever hardcoded here, and an unset variable just leaves that
# integration unconfigured (isConfigured() returns false, calls are skipped)
# rather than failing startup. See TECHNICAL_ARCHITECTURE.md §18/§22.
# Every rate limit below is set from that provider's OWN published number,
# researched 2026-09-16 (not assumed), with a safety margin — except
# data.gov.in, which publishes no numeric limit anywhere found; that one is
# an explicit, conservative guess, flagged as such rather than invented
# with false confidence. See TECHNICAL_ARCHITECTURE.md §17.3/§18.
app:
  geonames:
    username: ${GEONAMES_USERNAME:}
    base-url: http://api.geonames.org
    # GeoNames' own published free-tier ceiling: 1,000 credits/hour,
    # 10,000/day (geonames.org/export/credits.html). 10/min ≈ 600/hour —
    # comfortably under that, with headroom for the manual debug endpoint too.
    limit-for-period: ${GEONAMES_LIMIT:10}
    refresh-period-ms: ${GEONAMES_REFRESH_MS:60000}
  datagovin:
    api-key: ${DATA_GOV_IN_API_KEY:}
    # The rent/cost dataset resource saved during account setup (§22.2) —
    # this id is a public dataset identifier, not a credential, so it's safe
    # to default here; override only if you point at a different dataset.
    resource-id: ${DATA_GOV_IN_RESOURCE_ID:5c2f62fe-5afa-4119-a499-fec9d604d5bd}
    base-url: https://api.data.gov.in
    # UNVERIFIED — data.gov.in publishes no numeric rate limit we could
    # find anywhere. This is a deliberately conservative guess, not a
    # researched number; tighten or loosen once a real one is confirmed.
    limit-for-period: ${DATA_GOV_IN_LIMIT:10}
    refresh-period-ms: ${DATA_GOV_IN_REFRESH_MS:60000}
  frankfurter:
    base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev/v1}
    # Frankfurter publishes no hard quota (its own docs say "soft fair-use
    # limits, no monthly/daily caps") — this is a self-imposed courtesy
    # cap, not something Frankfurter enforces on us.
    limit-for-period: ${FRANKFURTER_LIMIT:20}
    refresh-period-ms: ${FRANKFURTER_REFRESH_MS:60000}
  ai:
    ollama:
      model: ${OLLAMA_MODEL:qwen3:4b-instruct}
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:720}
      # Local — no external quota exists. This cap is purely a safety
      # valve against an accidental runaway loop pegging the CPU.
      limit-for-period: ${OLLAMA_LIMIT:60}
      refresh-period-ms: ${OLLAMA_REFRESH_MS:60000}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      base-url: https://api.groq.com/openai/v1
      # Groq's published free-tier ceiling is 30 requests/minute (org-wide,
      # per model). 25/min leaves a safety margin.
      limit-for-period: ${GROQ_LIMIT:25}
      refresh-period-ms: ${GROQ_REFRESH_MS:60000}
    mistral:
      api-key: ${MISTRAL_API_KEY:}
      model: ${MISTRAL_MODEL:mistral-small-latest}
      base-url: https://api.mistral.ai/v1
      # Mistral's published free-tier ceiling is 1 request PER SECOND,
      # org-wide — expressed as "1 per 1.2s" rather than "60 per minute",
      # since a per-minute bucket would let a burst blow straight past
      # the real 1/sec limit in the first second of every minute.
      limit-for-period: ${MISTRAL_LIMIT:1}
      refresh-period-ms: ${MISTRAL_REFRESH_MS:1200}
  masters:
    # Which cities this service's own refresh looks up by exact name — writes
    # into the shared lifestyle_master schema (scripts/lifestyle-master-schema.sql),
    # which Travel/Property read via this service's API rather than owning
    # their own copies. Matches the illustrative places already in
    # tripData.ts/cityData.ts (Dubai, an international example, has no
    # bulk-discovery pass, so it stays in this explicit list).
    seed-cities: ${MASTER_SEED_CITIES:Pune,Mumbai,Gwalior,Delhi,Dubai,Bengaluru}
    # AED was the original currency choice but Frankfurter is ECB-based and
    # doesn't cover it (confirmed live, 2026-09-17) — base stays INR, and
    # currency refresh now imports every currency Frankfurter returns for
    # this base, not a pre-configured shortlist.
    base-currency: ${MASTER_BASE_CURRENCY:INR}
    # Bulk Indian-city discovery bounds (GeoNames searchJSON by country,
    # ordered by population — see GeoNamesClient.searchByCountry) — real,
    # sourced rows only, paged rather than one unbounded request, so a
    # refresh can grow past the six seed-cities names above without ever
    # inventing a city. Target 100+ distinct cities; page size and max
    # pages bound total GeoNames credits spent per refresh
    # (pageSize * maxPages = 500 worst case, well under the 1,000
    # credits/hour ceiling this account already respects via
    # ResilienceGuard).
    india-city-target-count: ${MASTER_INDIA_CITY_TARGET_COUNT:100}
    india-city-page-size: ${MASTER_INDIA_CITY_PAGE_SIZE:100}
    india-city-max-pages: ${MASTER_INDIA_CITY_MAX_PAGES:5}
    # Indian pincode refresh runs one searchPostalCodes call per city — with
    # 100+ Indian cities now real, refreshing pincodes for literally all of
    # them in one pass would spend most of the hourly GeoNames quota on a
    # single button click. Bounded to this many cities (by name, same order
    # lifestyle_master.city returns them) per refresh instead.
    india-pincode-city-limit: ${MASTER_INDIA_PINCODE_CITY_LIMIT:20}

server:
  port: ${INTEGRATION_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
