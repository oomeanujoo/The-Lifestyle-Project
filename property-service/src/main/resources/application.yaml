spring:
  application:
    name: property-service
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=property
    username: ${PROPERTY_DB_USER:property_app}
    password: ${PROPERTY_DB_PASSWORD:property-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: property
  flyway:
    enabled: true
    schemas: property
    default-schema: property
    create-schemas: true

# Where to reach integration-service — the single owner of lifestyle_master
# (§17/§20). This service no longer refreshes any master data itself, or
# calls Groq/Mistral/GeoNames directly; it only reads city/currency/
# bhk-type/service-addon masters through integration-service's API and,
# when domain code needs an FK-satisfying local row, mirrors that
# canonical value into its own local tables on demand — see
# LocalMasterIdResolver.
app:
  integration:
    base-url: ${INTEGRATION_SERVICE_URL:http://localhost:8083}

server:
  port: ${PROPERTY_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
