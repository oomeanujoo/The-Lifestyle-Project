server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/travel/ {
        proxy_pass http://travel-service:8081;
        proxy_set_header Host $host;
    }

    location /api/property/ {
        proxy_pass http://property-service:8082;
        proxy_set_header Host $host;
    }

    location /api/integration/ {
        proxy_pass http://integration-service:8083;
        proxy_set_header Host $host;
        proxy_read_timeout 750s;
    }

    location / {
        # This local Compose app is rebuilt often; a browser must recheck the
        # SPA entry and not keep an older Travel screen after a container swap.
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
