spring:
  application:
    name: travel-service
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=travel
    username: ${TRAVEL_DB_USER:travel_app}
    password: ${TRAVEL_DB_PASSWORD:travel-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: travel
  flyway:
    enabled: true
    schemas: travel
    default-schema: travel
    create-schemas: true

# Where to reach integration-service — the single owner of lifestyle_master
# (§17/§20). This service no longer refreshes any master data itself, or
# calls Groq/Mistral/GeoNames directly; it only reads city/currency/
# transport-mode masters through integration-service's API and, when
# domain code needs an FK-satisfying local row, mirrors that canonical
# value into its own city/currency/transport_mode tables on demand — see
# LocalMasterIdResolver.
app:
  integration:
    base-url: ${INTEGRATION_SERVICE_URL:http://localhost:8083}
  # Real road-route provider for the demo vertical slice (§21 phase
  # road-route) — OSRM's free public demo server, no key, no SLA. Disabled
  # by default; opt in with ROSM_ENABLED=true. Falls back to the existing
  # deterministic straight-line (Haversine) comparison whenever this is
  # disabled, misconfigured, or the provider call itself fails — never a
  # 500, and never presented as equivalent to a real road distance.
  routing:
    osrm:
      enabled: ${OSRM_ENABLED:false}
      base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    # Deterministic fuel-cost inputs — explicit numbers, never AI-estimated
    # or fetched from an unverified live price source (§10).
    fuel-cost:
      fuel-price-per-litre: ${FUEL_PRICE_PER_LITRE:100.0}
      vehicle-km-per-litre: ${VEHICLE_KM_PER_LITRE:15.0}
      currency: ${FUEL_COST_CURRENCY:INR}

server:
  port: ${TRAVEL_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
