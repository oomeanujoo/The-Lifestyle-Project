services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-lifestyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TRAVEL_DB_USER: ${TRAVEL_DB_USER:-travel_app}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD:-travel-local-only}
      PROPERTY_DB_USER: ${PROPERTY_DB_USER:-property_app}
      PROPERTY_DB_PASSWORD: ${PROPERTY_DB_PASSWORD:-property-local-only}
      INTEGRATION_DB_USER: ${INTEGRATION_DB_USER:-integration_app}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:-integration-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lifestyle-postgres:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./scripts/lifestyle-master-schema.sql:/docker-entrypoint-initdb.d/02-lifestyle-master-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.34.1
    environment:
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-10m}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - lifestyle-ollama:/root/.ollama
  lifestyle-web:
    build:
      context: ./lifestyle-web
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./lifestyle-web
          ignore:
            - node_modules/
            - dist/
            - .npm-cache/
            - .env
            - .env.*
            - "*.log"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      travel-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
  travel-service:
    build:
      context: ./travel-service
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./travel-service
          ignore:
            - .gradle/
            - build/
            - .idea/
            - "*.iml"
            - "*.log"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      TRAVEL_DB_USER: ${TRAVEL_DB_USER:-travel_app}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD:?Set TRAVEL_DB_PASSWORD in an ignored .env file}
      # Without this, application.yaml's default (http://localhost:8083)
      # means "this container itself" inside Docker's network, not the
      # integration-service container — every master-data refresh call
      # silently fails as a result. See TECHNICAL_ARCHITECTURE.md §17.3/§18.
      INTEGRATION_SERVICE_URL: http://integration-service:8083
      OSRM_ENABLED: ${OSRM_ENABLED:-false}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${TRAVEL_JVM_MAX_HEAP:-512m}
    ports:
      - "127.0.0.1:${TRAVEL_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 8
  property-service:
    build:
      context: ./property-service
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./property-service
          ignore:
            - .gradle/
            - build/
            - .idea/
            - "*.iml"
            - "*.log"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      PROPERTY_DB_USER: ${PROPERTY_DB_USER:-property_app}
      PROPERTY_DB_PASSWORD: ${PROPERTY_DB_PASSWORD:?Set PROPERTY_DB_PASSWORD in an ignored .env file}
      # Same reasoning as travel-service — see that service's comment.
      INTEGRATION_SERVICE_URL: http://integration-service:8083
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${PROPERTY_JVM_MAX_HEAP:-512m}
    ports:
      - "127.0.0.1:${PROPERTY_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 8
  integration-service:
    build:
      context: ./integration-service
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./integration-service
          ignore:
            - .gradle/
            - build/
            - .idea/
            - "*.iml"
            - "*.log"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      INTEGRATION_DB_USER: ${INTEGRATION_DB_USER:-integration_app}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Set INTEGRATION_DB_PASSWORD in an ignored .env file}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-720}
      # These were missing entirely — Compose does NOT forward host/.env
      # variables into a container unless listed here explicitly, so
      # integration-service always saw these as unset regardless of what
      # was in your .env file. Each defaults to empty, matching the
      # existing "unset = unconfigured, calls are skipped" pattern (§18/§22)
      # — no value is ever hardcoded here, only read from your own .env.
      GEONAMES_USERNAME: ${GEONAMES_USERNAME:-}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      DATA_GOV_IN_RESOURCE_ID: ${DATA_GOV_IN_RESOURCE_ID:-5c2f62fe-5afa-4119-a499-fec9d604d5bd}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${INTEGRATION_JVM_MAX_HEAP:-512m}
    ports:
      - "127.0.0.1:${INTEGRATION_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/actuator/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 8
volumes:
  lifestyle-postgres:
  lifestyle-ollama:
